<style>
/* ───────── Tokens ───────── */
:root {
  --bg: #F3EEFF;
  --sky-top: #E4D8FF;
  --sky-bot: #F6F1FF;
  --ink: #3D2B66;
  --ink-soft: #6E5A9A;
  --ink-faint: #9A8BC0;
  --card: #FFFFFF;
  --card-2: #F7F3FF;
  --line: #E3D9FA;
  --lav: #C9B8F5;
  --purple: #7B5CC4;
  --on-purple: #FFFFFF;
  --purple-press: #5B3FA0;
  --mint: #BDEBD8;
  --mint-deep: #54B78E;
  --calm: #EEE6FF;
  --info: #E6F0FF;
  --info-ink: #3F5C99;
  --if: #FFEDE6;
  --if-ink: #9A4F3A;
  --puff: .55;
  --icon: #7B5CC4;
  --panel: #D9CBF5;
  --panel-shadow: 0 14px 30px rgba(61, 43, 102, .22), 0 2px 6px rgba(61, 43, 102, .10);
  --shadow: 0 6px 18px rgba(86, 64, 150, .12);
  --press: 0 4px 0 #D9CCF6;
  --radius: 22px;
  --fs: 1;
  --run-dur: .7s;
  color-scheme: light only; /* always the lavender look; stops phones auto-darkening it */
}
:root[data-sky="night"] {
  --bg: #1C1733;
  --sky-top: #2A2150;
  --sky-bot: #1F1939;
  --ink: #F1EBFF;
  --ink-soft: #C8BBEB;
  --ink-faint: #8E80B8;
  --card: #2A2346;
  --card-2: #332A55;
  --line: #3F3466;
  --lav: #6E5AA8;
  --purple: #B49CF5;
  --on-purple: #1C1733;
  --purple-press: #6E58B0;
  --mint: #2F6B57;
  --mint-deep: #7DDBB4;
  --calm: #352C5C;
  --info: #26345A;
  --info-ink: #BFD3FF;
  --if: #4A2E33;
  --if-ink: #FFC9B8;
  --puff: .08;
  --icon: #C3AEF8;
  --panel: #17112B;
  --panel-shadow: 0 14px 30px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  --shadow: 0 6px 18px rgba(0, 0, 0, .35);
  --press: 0 4px 0 #151127;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { font-size: calc(16px * var(--fs)); background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: Nunito, Quicksand, ui-rounded, system-ui, sans-serif; font-weight: 600;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
#app { max-width: 520px; margin: 0 auto; min-height: 100dvh; padding-bottom: calc(86px + env(safe-area-inset-bottom)); }

/* ───────── Sky ───────── */
.sky {
  position: relative; height: 222px; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bot));
  border-radius: 0 0 32px 32px;
  padding-top: env(safe-area-inset-top);
}
.sky-clouds .puff { position: absolute; background: #fff; opacity: var(--puff); border-radius: 999px; }
.puff.p1 { width: 120px; height: 38px; left: -30px; top: 120px; }
.puff.p2 { width: 90px; height: 30px; right: -20px; top: 70px; }

.section-pills {
  position: relative; z-index: 3; display: flex; gap: 6px; justify-content: center;
  padding: 10px 12px 0;
}
.section-pills button {
  padding: 6px 12px; border-radius: 999px; font-size: .82rem; font-weight: 800;
  background: color-mix(in srgb, var(--card) 70%, transparent); color: var(--ink-soft);
  box-shadow: 0 2px 0 var(--line); position: relative; transition: background .2s;
}
.section-pills button.on { background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--lav); }
.section-pills button:active { top: 1px; }

.cloudcat {
  position: absolute; z-index: 2; left: 50%; top: calc(36px + env(safe-area-inset-top));
  width: 150px; margin-left: -75px; animation: float 4s ease-in-out infinite;
}
.cloudcat svg { width: 100%; height: auto; display: block; overflow: visible; }
@keyframes float { 0%, 100% { top: calc(36px + env(safe-area-inset-top, 0px)); } 50% { top: calc(29px + env(safe-area-inset-top, 0px)); } }
.meow #eyes-open, .meow #mouth-meow { display: inline !important; }
.meow #eyes-closed, .meow #mouth-smile { display: none !important; }

.titles { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; z-index: 2; pointer-events: none; }
.titles h1 { margin: 0; font-size: 1.55rem; font-weight: 900; letter-spacing: -.01em; }
.titles p { margin: 0; color: var(--ink-soft); font-size: .92rem; }

.stars-layer { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.star { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; }
.star svg { width: 100%; height: 100%; display: block; }
.star.big { width: 36px; height: 36px; margin: -18px 0 0 -18px; }


.bubble {
  position: absolute; z-index: 4; right: 10px; top: calc(46px + env(safe-area-inset-top));
  max-width: min(200px, calc(50% - 40px)); padding: 8px 12px; border-radius: 16px 16px 16px 4px;
  background: var(--card); color: var(--ink); font-weight: 800; font-size: .88rem; line-height: 1.25;
  box-shadow: var(--shadow); visibility: hidden; pointer-events: none;
  transition: top .3s cubic-bezier(.3, 1.6, .5, 1), visibility 0s .3s;
}
.bubble.show { visibility: visible; top: calc(40px + env(safe-area-inset-top, 0px)); transition: top .3s cubic-bezier(.3, 1.6, .5, 1); }

/* ───────── Progress ───────── */
.progress-wrap { position: relative; margin: 14px max(18px, env(safe-area-inset-right, 0px)) 4px max(18px, env(safe-area-inset-left, 0px)); padding-top: 34px; }
.progress { height: 16px; border-radius: 999px; background: var(--card); box-shadow: inset 0 2px 4px rgba(80, 60, 140, .12); overflow: hidden; margin-right: 46px; }
.fill {
  height: 100%; width: 0; border-radius: 999px;
  background: linear-gradient(90deg, #C9B8F5, #A98BE8, #F9B9CF);
  transition: width 1.2s cubic-bezier(.3, .9, .3, 1);
}
@keyframes shimmer { to { background-position: -200% 0; } }
.pct { position: absolute; right: 0; bottom: -2px; font-weight: 900; font-size: .9rem; color: var(--ink-soft); }
.runner {
  position: absolute; top: -2px; left: 0; width: 52px; margin-left: -26px;
  transition: left 1.4s cubic-bezier(.3, .9, .3, 1);
}
.runner svg { width: 100%; height: auto; display: block; }
.runner #leg-fl, .runner #leg-br, .runner #leg-fr, .runner #leg-bl, .runner #tail { transform-box: fill-box; transform-origin: 50% 0; }
.runner[data-pose="a"] #leg-fl, .runner[data-pose="a"] #leg-br { transform: rotate(26deg); }
.runner[data-pose="a"] #leg-fr, .runner[data-pose="a"] #leg-bl { transform: rotate(-26deg); }
.runner[data-pose="b"] #leg-fl, .runner[data-pose="b"] #leg-br { transform: rotate(-26deg); }
.runner[data-pose="b"] #leg-fr, .runner[data-pose="b"] #leg-bl { transform: rotate(26deg); }
.runner[data-pose="b"] #tail { transform: rotate(-8deg); }
.runner.sprint { --run-dur: .22s; }

/* ───────── Generic cards / buttons ───────── */
main { padding-block: 8px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin: 12px 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px;
  border-radius: 16px; background: var(--card); box-shadow: var(--press), var(--shadow); font-weight: 800;
  position: relative; top: 0; transition: top .12s, box-shadow .12s;
}
.btn:active { top: 3px; box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--purple); color: var(--on-purple); box-shadow: 0 4px 0 var(--purple-press), var(--shadow); }
.btn.soft { background: var(--card-2); box-shadow: 0 3px 0 var(--line); }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: .9rem; border-radius: 13px; }
.btn.block { width: 100%; }
.link { color: var(--ink-soft); font-weight: 800; font-size: .92rem; padding: 10px 4px; min-height: 44px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.muted { color: var(--ink-soft); }
.h2 { font-size: 1.25rem; font-weight: 900; margin: 18px 0 6px; }
.h3 { font-size: .8rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin: 18px 4px 6px; }

/* ───────── Picker ───────── */
.picker-ask { font-size: 1.2rem; font-weight: 900; margin: 16px 2px 2px; }
.picker { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.gcard {
  position: relative; text-align: left; background: var(--card); border-radius: 20px; padding: 14px 14px 12px; min-height: 108px;
  box-shadow: 0 4px 0 var(--line), var(--shadow); top: 0; transition: top .12s, box-shadow .12s;
  display: flex; flex-direction: column; gap: 4px; animation: pop-in .4s cubic-bezier(.3, 1.5, .5, 1) backwards;
}
.gcard:active { top: 3px; box-shadow: 0 1px 0 var(--line); }
.gcard .gicon { font-size: 1.6rem; }
.gcard .gname { font-weight: 900; font-size: 1.02rem; line-height: 1.15; }
.gcard .gmeta { font-size: .82rem; color: var(--ink-soft); }
.gcard .gdot { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; }
.gcard .gdot svg { width: 100%; height: 100%; }
.gcard.first { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 12px; background: linear-gradient(120deg, var(--card), var(--calm)); }
.gcard.bonus { background: var(--card-2); box-shadow: 0 3px 0 var(--line); }
.gcard.done { opacity: .62; }
.gcard.done .gdot { width: 30px; height: 30px; top: 8px; right: 8px; }
.badge { display: inline-block; font-size: .7rem; font-weight: 900; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: var(--mint); color: var(--ink); width: max-content; }
.badge.bonus { background: var(--calm); color: var(--ink-soft); }
@keyframes pop-in { from { top: 10px; } to { top: 0; } }

/* ───────── Group / stage view ───────── */
.topbar { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 0; }
.scene { position: relative; border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); margin: 8px 0 12px; animation: pop-in .45s ease backwards; background: var(--card-2); }
.scene svg { display: block; width: 100%; height: auto; }
.gtitle { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 4px 2px 2px; }
.gtitle h2 { margin: 0; font-size: 1.4rem; font-weight: 900; }
.gtitle .of { color: var(--ink-soft); font-weight: 800; white-space: nowrap; }
.gintro { margin: 2px 2px 8px; color: var(--ink-soft); }
.nextup { display: inline-block; font-size: .75rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; background: var(--mint); padding: 4px 10px; border-radius: 999px; margin: 6px 2px 0; }

.steps { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.step {

@keyframes slide-in { from { top: 16px; } to { top: 0; } }

@keyframes squish { 0% { box-shadow: inset 0 0 0 3px var(--lav); border-radius: 12px; } 35% { box-shadow: inset 0 0 0 19px var(--mint-deep); border-radius: 19px; } 100% { box-shadow: inset 0 0 0 3px var(--mint-deep); border-radius: 12px; } }
.txt { flex: 1; min-width: 0; line-height: 1.35; font-size: 1.05rem; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { padding: 4px 10px; border-radius: 999px; background: var(--card-2); box-shadow: 0 2px 0 var(--line); font-weight: 800; font-size: .9rem; }
.detail { margin-top: 8px; font-size: .92rem; color: var(--ink-soft); white-space: pre-line; background: var(--card-2); border-radius: 12px; padding: 8px 10px; }
.opens { display: inline-block; margin-top: 6px; font-size: .82rem; font-weight: 800; color: var(--ink-soft); background: var(--calm); padding: 3px 10px; border-radius: 999px; }
.say {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; margin-top: 10px; padding: 10px 12px; border-radius: 14px;

}

.mini-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

.ifbox { margin-top: 16px; border-radius: 18px; background: var(--if); color: var(--if-ink); overflow: hidden; }

.parts { display: flex; background: var(--card-2); border-radius: 16px; padding: 4px; gap: 4px; margin: 8px 0; }
.parts button { flex: 1; padding: 10px 6px; border-radius: 12px; font-weight: 800; font-size: .9rem; color: var(--ink-soft); min-height: 44px; }

.calm-pill {
  display: block; width: 100%; margin: 0 0 6px; padding: 12px 16px; border-radius: 16px;
  background: var(--calm); color: var(--ink); font-weight: 900; box-shadow: 0 3px 0 var(--lav);
}

.donecard { text-align: center; padding: 26px 18px; }
.donecard .big { font-size: 1.5rem; font-weight: 900; margin: 8px 0 4px; }
.constellation { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0; }
.constellation span { width: 34px; height: 34px; display: inline-block; position: relative; animation: pop-in .5s backwards; }
.constellation svg { width: 100%; height: 100%; }

/* ───────── Tab bar ───────── */
.tabbar {
  position: fixed; z-index: 30; left: 0; right: 0; margin: 0 auto; bottom: 0; width: min(520px, 100%);
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: var(--card);

}

/* ───────── Overlay / sheets ───────── */
.overlay {

  display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
}
.overlay.center { justify-content: center; }
.overlay.closing { visibility: hidden; }
.sheet {
  width: min(520px, 100%); max-height: 88dvh; overflow: auto; background: var(--bg); border-radius: 28px 28px 0 0;
  padding: 18px 18px calc(22px + env(safe-area-inset-bottom)); position: relative; animation: rise .35s cubic-bezier(.3, 1.2, .5, 1) backwards;
}
.sheet.tall { height: 88dvh; display: flex; flex-direction: column; }
@keyframes rise { from { top: 50px; } to { top: 0; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.sheet-head h3 { margin: 0; font-size: 1.25rem; font-weight: 900; }
.x { width: 44px; height: 44px; border-radius: 14px; background: var(--card); box-shadow: 0 3px 0 var(--line); font-size: 1.1rem; }

.petstage { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 20px; width: min(420px, 100%); }
.petcat { width: min(300px, 80vw); touch-action: none; position: relative; top: 0; animation: petfloat 4s ease-in-out infinite; }
@keyframes petfloat { 50% { top: -8px; } }
.petcat svg { width: 100%; height: auto; display: block; overflow: visible; }
.petcat.petting svg { animation: purr .12s linear infinite; }
@keyframes purr { 50% { margin-top: 1px; } }
.pethint { color: #fff; font-weight: 800; text-align: center; min-height: 1.4em; text-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
.petbtns { display: flex; gap: 12px; }
.petbtns .btn { min-width: 130px; font-size: 1.05rem; }
.petstage { position: relative; }
.heart { position: absolute; z-index: 2; pointer-events: none; font-size: 22px; animation: heart 1.4s ease-out forwards; }
@keyframes heart { 0% { margin-top: 0; margin-left: -11px; font-size: 12px; } 100% { margin-top: -90px; margin-left: calc(-11px + var(--dx)); font-size: 24px; } }

.helplist { display: flex; flex-direction: column; gap: 10px; }
.helpbtn { text-align: left; padding: 14px 16px; border-radius: 16px; background: var(--card); box-shadow: 0 3px 0 var(--line); font-weight: 800; min-height: 52px; }
.helpbtn.if { background: var(--if); color: var(--if-ink); }
.helpbtn.calm { background: var(--calm); }
.helpbtn.heart-btn { background: linear-gradient(120deg, #FBE3EE, #EEE6FF); color: #3D2B66; }
.helpbtn { position: relative; }
.helpbtn:active { top: 2px; box-shadow: 0 1px 0 var(--line); }
.answer { font-size: 1.25rem; font-weight: 800; line-height: 1.45; margin: 8px 0 12px; }

.chat { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 6px 2px 10px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 18px; line-height: 1.4; white-space: pre-wrap; position: relative; animation: pop-in .3s backwards; }
.msg.user { align-self: flex-end; background: var(--purple); color: var(--on-purple); border-bottom-right-radius: 6px; }
.msg.assistant { align-self: flex-start; background: var(--card); box-shadow: var(--shadow); border-bottom-left-radius: 6px; }
.msg.assistant::before { content: '🐱 '; }
.typing span { display: inline-block; position: relative; top: 0; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--ink-faint); animation: dots 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 50% { top: -4px; } }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 48px; max-height: 120px; }

.bigsay {
  position: fixed; inset: 0; z-index: 70; background: #FFFDF8; color: #2A1E4D; display: flex; flex-direction: column;
  justify-content: center; align-items: center; padding: 28px; text-align: center;
}
.bigsay p { font-size: clamp(1.8rem, 8vw, 3rem); font-weight: 900; line-height: 1.25; margin: 0 0 24px; white-space: pre-wrap; }
.bigsay small { color: #7A6CA3; font-weight: 800; }

.breathe { position: relative; width: 140px; height: 140px; margin: 10px auto 16px; display: grid; place-items: center; font-weight: 900; color: #3D2B66; }
.breathe::before { content: ''; position: absolute; left: 50%; top: 50%; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; background: radial-gradient(circle, #E9DEFF, #B79CF2); animation: breathe 10s ease-in-out infinite; }
.breathe span { position: relative; z-index: 1; }
@keyframes breathe { 40% { width: 140px; height: 140px; margin: -70px 0 0 -70px; } }

.celebrate { text-align: center; color: #fff; padding: 24px; }
.celebrate h2 { font-size: 2rem; margin: 10px 0 4px; }
.celebrate p { font-size: 1.15rem; }

/* ───────── Forms / wallet / settings ───────── */
label.field { display: block; margin: 10px 0; font-weight: 800; }
label.field > span { display: block; font-size: .85rem; color: var(--ink-soft); margin-bottom: 4px; }
input[type="text"], input[type="tel"], input[type="url"], input[type="password"], textarea, select {
  width: 100%; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--card-2); font-weight: 700; outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--lav); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 10px 14px; border-radius: 12px; background: var(--card-2); font-weight: 800; box-shadow: 0 2px 0 var(--line); min-height: 44px; }
.seg button.on { background: var(--purple); color: var(--on-purple); box-shadow: 0 2px 0 var(--purple-press); }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-weight: 800; min-height: 48px; }
.switch { width: 54px; height: 32px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; flex: 0 0 auto; }
.switch::after { content: ''; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .15); transition: left .25s cubic-bezier(.3, 1.4, .5, 1); }
.switch.on { background: var(--mint-deep); }
.switch.on::after { left: 26px; }
input[type="range"] { width: 100%; accent-color: var(--purple); }

.tickets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ticket { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.ticket .thumb { height: 120px; background: var(--card-2); display: grid; place-items: center; font-size: 2.4rem; overflow: hidden; }
.ticket .thumb img { width: 100%; height: 100%; object-fit: cover; }
.ticket .tl { padding: 8px 10px; }
.ticket input { padding: 6px 8px; font-size: .9rem; border-radius: 10px; }
.ticket .tact { display: flex; justify-content: space-between; padding: 0 6px 8px; }
.addticket { min-height: 172px; border: 3px dashed var(--lav); border-radius: 18px; display: grid; place-items: center; font-weight: 900; color: var(--ink-soft); text-align: center; }
.viewer { position: fixed; inset: 0; z-index: 70; background: #fff; display: flex; flex-direction: column; }
.viewer .vbar { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: #F3EEFF; color: #3D2B66; font-weight: 800; }
.viewer .vbody { flex: 1; overflow: auto; display: grid; place-items: center; background: #fff; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.viewer iframe { width: 100%; height: 100%; border: 0; }
.infocard { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; margin: 10px 0; }

.fin-section { margin: 14px 0; }
.fin-group { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border-radius: 16px; box-shadow: 0 3px 0 var(--line); margin: 8px 0; width: 100%; text-align: left; }
.fin-group .s { width: 34px; height: 34px; flex: 0 0 34px; }
.fin-group .s svg { width: 100%; height: 100%; }
.fin-steps { margin: 0 0 8px 12px; padding: 0; list-style: none; }
.fin-steps li { padding: 6px 0; display: flex; gap: 8px; align-items: center; }
.stat { display: flex; gap: 10px; }
.stat > div { flex: 1; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 12px; text-align: center; }
.stat b { display: block; font-size: 1.6rem; font-weight: 900; }

.toast { grid-column: 1 / -1; display: none; text-align: center; background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 12px; font-weight: 800; margin-bottom: 4px; }
.toast.show { display: block; }

/* ───────── Reduced motion ───────── */
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}

/* Checklist panel: a soft raised surface behind the steps so they read clearly */
.panel { background: var(--panel); border-radius: 26px; padding: 14px 12px 16px; margin: 4px 0 8px; box-shadow: var(--panel-shadow); }
.panel .gtitle { margin-top: 0; padding: 0 4px; }
.panel .gintro { padding: 0 4px; }
.panel .step { box-shadow: 0 3px 0 var(--line), 0 6px 14px rgba(61, 43, 102, .10); }

/* Pastel icons */
.ic { display: inline-block; width: 1.35em; height: 1.35em; vertical-align: -0.3em; background-color: var(--icon);
  -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }
.tabbar button.on .ic { background-color: var(--purple); }
.tabbar button:not(.on) .ic { background-color: var(--ink-faint); }
.gcard .gicon { line-height: 0; }
.gcard .gicon .ic { width: 46px; height: 46px; }
.gcard.first .gicon .ic { width: 52px; height: 52px; }
.gtitle h2 .ic { width: 1.3em; height: 1.3em; vertical-align: -0.25em; }
.section-pills .ic { width: 1.25em; height: 1.25em; vertical-align: -0.32em; }
.h3 .ic { width: 1.6em; height: 1.6em; vertical-align: -0.55em; }

/* Overwhelmed pop-up: short and calm */
.calm-card { position: relative; width: min(400px, calc(100% - 32px)); text-align: center; padding: 22px 18px 20px; }
.calm-x { position: absolute; top: 12px; right: 12px; }
.calm-line { font-size: 1.45rem; font-weight: 900; margin: 4px 0 16px; text-wrap: balance; }
.calm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.calm-actions .btn { width: 100%; padding: 10px 8px; }
.calm-num { margin: 12px 0 0; color: var(--ink-soft); font-weight: 800; user-select: text; }

/* Tick → the step quietly melts into the panel, then the gap closes (layout/paint only, no GPU layers) */
.step.leaving { overflow: hidden; pointer-events: none; animation: step-melt .7s ease-in-out forwards; }
.step.leaving .txt, .step.leaving .txt * { animation: melt-text .35s ease-out forwards; }
.step.leaving .check { animation: melt-check .35s ease-out forwards; }
@keyframes step-melt {
  0%   { max-height: var(--h); background-color: var(--card); box-shadow: 0 3px 0 var(--line), 0 6px 14px rgba(61, 43, 102, .10); }
  50%  { max-height: var(--h); background-color: var(--panel); box-shadow: 0 0 0 transparent; }
  100% { max-height: 0; background-color: var(--panel); box-shadow: 0 0 0 transparent; padding-top: 0; padding-bottom: 0; margin-bottom: -10px; }
}
@keyframes melt-text { to { color: transparent; text-decoration-color: transparent; border-color: transparent; background-color: transparent; } }
.step.leaving .check path { animation: melt-stroke .3s ease-out forwards; }
@keyframes melt-stroke { to { stroke: transparent; } }
@keyframes melt-check { to { background-color: var(--panel); box-shadow: inset 0 0 0 3px transparent; } }
.panel { overflow: hidden; }

/* One at a time / Whole view switch */
.viewbar { display: flex; background: var(--card-2); border-radius: 14px; padding: 4px; gap: 4px; margin: 6px 0 8px; }
.viewbtn { flex: 1; min-height: 40px; border-radius: 11px; font-weight: 800; font-size: .9rem; color: var(--ink-soft); position: relative; }
.viewbtn.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--line); }

/* Whole view */
.whole-part { margin: 18px 4px 4px; font-size: .78rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.whole-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; padding: 10px 4px 0; border-top: 2px dashed var(--lav); font-weight: 900; font-size: 1.1rem; }
.panel > .whole-divider:first-child, .panel > .whole-part:first-child + .whole-divider { margin-top: 2px; border-top: 0; padding-top: 0; }
.panel > .whole-part:first-child { margin-top: 2px; }
.whole-name { flex: 1; min-width: 0; }
.whole-count { color: var(--ink-soft); font-size: .9rem; }
.whole-star { width: 26px; height: 26px; flex: 0 0 26px; }
.whole-star svg { width: 100%; height: 100%; }
.whole-steps { margin-top: 4px; }

<div id="sprite" hidden></div>

  <div id="app">
    <header class="sky" id="sky">
      <div class="sky-clouds" aria-hidden="true">
        <span class="puff p1"></span><span class="puff p2"></span>
      </div>
      <div class="stars-layer" id="stars" aria-hidden="true"></div>
      <nav class="section-pills" id="sectionPills" aria-label="Choose a day"></nav>
      <button class="cloudcat" id="cloudcat" aria-label="Tap the cat to pet him or get help"></button>
      <div class="bubble" id="bubble" role="status" aria-live="polite"></div>

      </div>
      <div class="runner" id="runner" aria-hidden="true"></div>
      <span class="pct" id="pct">0%</span>
    </div>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <button data-tab="today" class="on"><span>🏠</span>Today</button>
      <button data-tab="finished"><span>⭐</span>Finished</button>
      <button data-tab="wallet"><span>🎫</span>Wallet</button>
      <button data-tab="settings"><span>⚙️</span>Settings</button>
    </nav>

const SYSTEM_PROMPT = `You are the gentle voice of a little cat who lives on a cloud inside a travel checklist app. You are helping one person through a trip (Lund → Copenhagen Airport → Bristol, and back). You receive a context block with what they have finished, what they are doing now, what is next, and the current time. Use it. Never ask for information you already have.

Personality: kind, warm, understanding, non-judgemental, and genuinely helpful. You are objective and practical, and you always take feelings into account.

How to answer (keep it small and calm, never overwhelming):
1. Reassurance first: ONE short, warm sentence.
2. Then the next step: usually just ONE small, concrete thing to do right now. Two at most, as a short numbered list. Never more.
3. Keep the whole reply under about 60 words. Short sentences, one idea each. Plenty of white space.
4. Don't explain everything at once. If there is more they might need, end with a gentle offer like "Want the next step?" instead of saying it all.
5. No long paragraphs, no lists of options, no "also…" extras, no repeating what they said back at length. At most one emoji.
6. Only give a longer answer if they clearly ask for more detail.

The person is autistic, has ADHD and BPD, and has past trauma. Adjust how you help, but NEVER mention or point out any diagnosis unless they bring it up first:
- Be literal and clear. No idioms, sarcasm, vague phrases or hidden meanings. Say exactly what will happen and in what order.
- When they need to speak to someone, give the exact words in quotes.
- One question at a time, and only if you really need the answer.
- If they're stuck or frozen, choose the smallest possible next action for them instead of giving options.
- Offer choices instead of commands where possible. Be predictable and steady.
- If something is time-critical (like the gate closing), say it calmly with the actual time, and put the action first. Do not add pressure words.
- If emotions are very intense: ground first (wall or seat, headphones, plush, slow breaths), stay with them and don't rush to fix things. Never sound cold, distant, annoyed or like you are leaving. End with something like "I'm right here. Tell me how you're doing."
- Never say: "calm down", "don't worry", "just", "simply", "you should have", "obviously".
- Never shame mistakes. Missed something? Treat it as normal and fixable, then help fix it.
- Now and then, briefly celebrate what they have already done (you can see it in the context). One short phrase, not a list.
- You may use the pet name from the context (for example "baby") now and then, matching the app's tone. Don't overdo cat jokes; a small 🐾 or 💜 is fine.
- Plain text only. No markdown headings, bold or tables. Numbered steps are fine.

Accuracy:
- Don't invent airport, airline or train facts. If you're not sure, say so kindly and tell them who to ask: staff in uniform, the information desk, the Ryanair desk, or the Ryanair app.
- Times: Sweden/Denmark are 1 hour ahead of the UK.

const __mod_storage = (() => {
// Progress + settings → localStorage. Uploaded ticket files → IndexedDB.
const KEY = 'cloudcat.v1';

const DEFAULT_SETTINGS = {
  stepsVisible: 3,          // 1, 3, custom number, or 0 = whole group
  volume: 0.6,
  sTick: true, sMeow: true, sPurr: true, sChime: true,
  haptics: true,

  name: 'baby',

  textSize: 1,              // 0.9 – 1.3
  theme: 'day',             // day | night
  aiUrl: '/api/chat',
  aiPass: '',
  openaiKey: '',            // stored only in this browser, never in the file
  openaiModel: 'gpt-5.5',
};

function defaultState() {
  return {
    ticks: {},              // stepId -> timestamp
    groupDone: {},          // groupId -> timestamp
    skipped: {},            // groupId -> true
    active: {},             // sectionId -> groupId (prep mode) | null
    stage: {},              // partId -> groupId (journey mode, manual jump)
    part: {},               // sectionId -> partId
    section: null,
    lastDay: null,
    info: { jan: '', address: '', meeting: '', trainTime: '', platform: '', seat: '14C' },
    files: [],              // [{id, label, type, name, addedAt}]
    chats: {},              // sectionId -> [{role, content}]
    settings: { ...DEFAULT_SETTINGS },
    welcomed: false,
  };
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultState();
    const s = JSON.parse(raw);
    const d = defaultState();
    return { ...d, ...s, info: { ...d.info, ...s.info }, settings: { ...d.settings, ...s.settings } };
  } catch {
    return defaultState();
  }
}

let timer;
function save(state) {
  clearTimeout(timer);
  timer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* storage full or blocked */ }
  }, 60);
}
function saveNow(state) {
  clearTimeout(timer);
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* ignore */ }
}

async function persist() {
  try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch { /* ignore */ }
}

// ═════════════════════════ ticking ═════════════════════════
function toggleStep(s, g, st, checkBtn) {
  sfx.unlock();
  if (isTicked(st)) {
    delete state.ticks[st.id];
    delete state.groupDone[g.id];
    save(); renderStars(); updateProgress(); renderView();
    return;
  }
  state.ticks[st.id] = Date.now();
  save();
  checkBtn?.classList.add('squish');
  const li = checkBtn?.closest('.step');
  li?.classList.add('done');
  const willHide = !!li && !ui.whole && Number(state.settings.stepsVisible) !== 0 && !ui.showDone;
  if (willHide) {
    setTimeout(() => {
      li.style.setProperty('--h', `${li.offsetHeight}px`);
      li.classList.add('leaving');
      sfx.whoosh();
    }, 380);
  }
  checkBtn?.setAttribute('aria-pressed', 'true');
  sfx.tick();
  sprint();
  updateProgress();
  setTimeout(() => { meowAnim(); sfx.meow(); }, 140);
  setTimeout(() => { sfx.burp(); addStar(st.id, g.color, false, true); }, 420);

  const finishedGroup = groupDone(g) && !state.groupDone[g.id];
  if (finishedGroup) {
    state.groupDone[g.id] = Date.now();
    delete state.skipped[g.id];
    save();
    setTimeout(() => { sfx.chime(); addStar(g.id, g.color, true, true); if (state.settings.bubbles !== 'off') bubble(pick(GROUP_DONE), 3800); }, 1000);
    setTimeout(() => {
      const part = currentPart(s);
      if (part.mode === 'prep') state.active[s.id] = null; else state.stage[part.id] = null;
      ui.showDone = false; ui.ifOpen = false;
      save(); renderView(); if (!ui.whole) window.scrollTo({ top: 0, behavior: 'smooth' });
      maybeCelebrate(s);
    }, 2300);
  } else {
    maybePraise();
    setTimeout(renderView, willHide ? 1120 : 520);
  }
}
function maybeCelebrate(s) {
  if (state.celebrated[s.id] || !s.groups.every(groupDone)) return;
  state.celebrated[s.id] = true; save();
  sfx.chime();
  const node = h('div', { class: 'celebrate' },
    h('div', { class: 'constellation' }, s.groups.map((g, i) => { const sp = h('span', { style: { animationDelay: `${i * 0.08}s` } }); sp.append(starSvg(g.color)); return sp; })),
    h('h2', {}, s.done.title), h('p', {}, s.done.text),

function viewPicker(s, part) {

function viewGroup(s, part, g, journey) {

      !done && g.badge !== 'first' ? h('button', { class: 'link', onclick: () => {

    section: `${s.title} (${s.date})${s.parts.length > 1 ? ` – ${part.label}` : ''}`,
    mode: part.mode === 'prep' ? 'free-order prep checklist' : 'journey, stages in order',
    current_group_or_stage: g ? `${g.name}${g.time ? ` (${g.time})` : ''}` : (part.mode === 'prep' ? 'choosing which group to do next' : 'all stages done'),
    remaining_in_current: g ? checks(g).filter((x) => !isTicked(x)).map((x) => x.text) : [],
    done_in_current: g ? checks(g).filter(isTicked).map((x) => x.text) : [],
    if_things_go_differently_here: g ? g.steps.filter((x) => x.t === 'if').map((x) => `${x.q} → ${x.a}${x.say ? ` Say: "${x.say}"` : ''}`) : [],
    next_up: nextGroup ? nextGroup.name : null,
    finished_groups_this_section: s.groups.filter(groupDone).map((x) => x.name),
    not_finished_groups_this_section: s.groups.filter((x) => !groupDone(x)).map((x) => x.name + (state.skipped[x.id] ? ' (skipped for later, bonus)' : '')),
    section_progress_percent: sectionProgress(s).pct,
    key_times: part.times ? part.times.map((t) => `${t[1]} ${t[2]}`) : null,
    other_sections_progress: SECTIONS.filter((x) => x !== s).map((x) => `${x.title}: ${sectionProgress(x).pct}%`),
    trip: {
      outbound: 'Tue 10 Nov: Lund C → train → Copenhagen Airport (Kastrup) → Ryanair FR746 11:50 to Bristol, seat 14C, lands 12:55 UK time. Gate closes 11:20.',
      return: 'Tue 24 Nov: Ryanair FR745 Bristol 13:25 → Copenhagen 16:25, then train to Lund. Gate closes 12:55 UK time.',
      meeting: 'Boyfriend Jan meets them at Bristol arrivals.',
      luggage: 'Cabin bag only, comfort plush toy, headphones, medicines with doctor’s letter and Schengen certificate.',
    },
  };
}
function openChat(mode, topic) {
  sfx.softTap();
  const s = sec();
  const hist = (state.chats[s.id] ||= []);
  const list = h('div', { class: 'chat', 'aria-live': 'polite' });
  const ta = h('textarea', { rows: 1, placeholder: mode === 'support' ? 'Tell me how you feel…' : 'What’s happening?', 'aria-label': 'Your message' });
  const sendBtn = h('button', { class: 'btn primary', 'aria-label': 'Send' }, 'Send');
  const draw = () => {
    list.replaceChildren(...hist.map((m) => h('div', { class: `msg ${m.role}` }, m.content)));
    list.scrollTop = list.scrollHeight;
  };
  const typing = () => { const t = h('div', { class: 'msg assistant typing' }, h('span'), h('span'), h('span')); list.append(t); list.scrollTop = list.scrollHeight; return t; };
  const ask = async (msgs) => {
    const t = typing(); sendBtn.disabled = true;
    let reply;
    try { reply = await askCat(msgs, buildContext(), state.settings); } catch (e) { reply = offlineReply(nextStepText(), !navigator.onLine, e?.message); }
    t.remove(); sendBtn.disabled = false;
    hist.push({ role: 'assistant', content: reply }); state.chats[s.id] = hist.slice(-30); save(); draw(); sfx.softTap();
  };
  const send = () => {
    const text = ta.value.trim(); if (!text) return;
    ta.value = ''; hist.push({ role: 'user', content: text }); save(); draw();
    ask(hist.slice(-20));
  };
  sendBtn.onclick = send;
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  const body = h('div', { style: { display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 } },
    list, h('div', { class: 'composer' }, ta, sendBtn),
    h('button', { class: 'link', style: { alignSelf: 'center' }, onclick: () => confirmSheet('Clear this chat?', 'Clear it', () => { state.chats[s.id] = []; save(); }) }, 'Clear chat'));
  openSheet(mode === 'support' ? '💜 Reassurance & support' : '✏️ Talk to me', body, { tall: true });
  draw();
  if (mode === 'support') {
    ask([...hist.slice(-16), { role: 'user', content: '(I tapped "Reassurance and support" in the app and haven’t typed anything yet. Please gently open the conversation: reassure me first, then ask softly how I’m doing.)' }]);
  } else if (topic) {
    ta.value = `${topic}. `; setTimeout(() => ta.focus(), 300);
  } else setTimeout(() => ta.focus(), 300);
}

// ── Welcome ──
function welcome() {
  const cat = svgEl('cloud-cat'); cat.style.width = '170px';
  const node = h('div', { class: 'card', style: { width: 'min(440px, calc(100% - 32px))', textAlign: 'center' } },
    h('div', { style: { display: 'flex', justifyContent: 'center' } }, cat),
    h('p', { style: { fontSize: '1.3rem', fontWeight: 900, margin: '6px 0' } }, 'Hi, I’m your cloud cat 💜'),
    h('p', { class: 'muted' }, 'Tap me if you need me.'),
    h('button', { class: 'btn primary block', onclick: () => { state.welcomed = true; save(); sfx.unlock(); sfx.chime(); closeOverlay(); } }, 'Let’s go ✨'));
  openOverlay(node, 'center');
}

// ═════════════════════════ boot ═════════════════════════
async function boot() {
  applySettings();
  await loadAssets();
  const today = dayIn(new Date());
  if (state.lastDay !== today || !state.section) { state.section = suggestedSection(); state.lastDay = today; save(); }

  catSvg = svgEl('cloud-cat');
  $('#cloudcat').append(catSvg);
  const runner = svgEl('running-cat');
  $('#runner').append(runner);
  const trot = () => {
    const r = $('#runner');
    if (state.settings.reduceMotion || document.hidden) r.dataset.pose = '';
    else r.dataset.pose = r.dataset.pose === 'a' ? 'b' : 'a';
    setTimeout(trot, r.classList.contains('sprint') ? 110 : 380);
  };
  trot();
  $('#cloudcat').addEventListener('click', openCatMenu);
  document.querySelectorAll('.tabbar button').forEach((b) => {
    b.querySelector('span')?.replaceChildren(icon(TAB_ICON[b.dataset.tab]));
    b.addEventListener('click', () => { sfx.softTap(); go(b.dataset.tab); });
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const top = document.querySelector('.bigsay, .viewer'); if (top) top.remove(); else closeOverlay();
  });
  renderAll();
  if (!state.welcomed) welcome();
  else setTimeout(() => bubble(pick(['Hi {name} 💜', 'I’m here with you.', 'Ready when you are.'])), 700);

  setInterval(() => {
    const ts = $('#timestrip');
    if (ts && tab === 'today' && !document.querySelector('.overlay:not([hidden])')) ts.replaceWith(viewTimes(currentPart(sec())));
  }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') store.saveNow(state); });
  store.persist();
  if (!window.__ARTIFACT && !window.__STANDALONE && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
boot();

return {  };
})();

</script>
